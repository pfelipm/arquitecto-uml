                    else { setNodes(nodes.map(n => ({ ...n, selected: false }))); setEdges(edges.map(ed => ({ ...ed, selected: false }))); }
                }

                // En campos de texto se deja el deshacer/rehacer nativo del navegador
                if (mod && (key === 'z' || key === 'y') && !isEditingField) {
                    e.preventDefault();
                    (key === 'y' || e.shiftKey) ? handleRedo() : handleUndo();
                }
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    if (isEditingField || !nodes.some(n => n.selected)) return;
                    e.preventDefault();
                    const step = (e.shiftKey || e.ctrlKey) ? 10 : 1;
                    const dx = (e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0) * step;
                    const dy = (e.key === 'ArrowUp' ? -1 : e.key === 'ArrowDown' ? 1 : 0) * step;
                    // Un punto de deshacer por pulsación (no por autorrepetición al mantener la tecla)
                    updateDiagramState(nodes.map(n => n.selected ? { ...n, x: n.x + dx, y: n.y + dy } : n), edges, !e.repeat);
                }
            };
            window.addEventListener('keydown', handleKeyDown); return () => window.removeEventListener('keydown', handleKeyDown);
            // Sin dependencias: se vuelve a registrar en cada render para leer siempre el estado actual
          });

          // --- RENDERIZADO NODOS ---
          const renderResizeHandles = (node) => {
              const s = 8;
              const h = [
                  { id: 'nw', x: -4, y: -4, cursor: 'nw-resize' },
                  { id: 'ne', x: node.width - 4, y: -4, cursor: 'ne-resize' },
                  { id: 'sw', x: -4, y: node.height - 4, cursor: 'sw-resize' },
                  { id: 'se', x: node.width - 4, y: node.height - 4, cursor: 'se-resize' },
                  { id: 'n', x: node.width / 2 - 4, y: -4, cursor: 'n-resize' },
                  { id: 's', x: node.width / 2 - 4, y: node.height - 4, cursor: 's-resize' },
                  { id: 'e', x: node.width - 4, y: node.height / 2 - 4, cursor: 'e-resize' },
                  { id: 'w', x: -4, y: node.height / 2 - 4, cursor: 'w-resize' }
              ];

              return ( <g> {h.map((pos) => ( <rect key={pos.id} x={pos.x} y={pos.y} width={s} height={s} fill="white" stroke={COLORS.selection} strokeWidth={1} style={{ cursor: pos.cursor }} onMouseDown={(e) => { e.stopPropagation(); dragSnapshotRef.current = { nodes, edges }; setIsResizing(true); setResizeHandle(pos.id); setActiveNodeId(node.id); setDragStart(getMousePos(e)); setInitialNodeGeom({ x: node.x, y: node.y, w: node.width, h: node.height }); }} /> ))} </g> );
          };

          const renderNode = (node) => {
            const isSelected = node.selected && !isExporting;
            const strokeColor = isSelected ? COLORS.selection : (isDarkMode ? COLORS.nodeBorderDark : COLORS.nodeBorder);
            const strokeWidth = isSelected ? 2 : 1;
            const fill = isDarkMode ? COLORS.nodeBgDark : COLORS.nodeBg;
            const textFill = isDarkMode ? COLORS.textDark : COLORS.text;

            const commonProps = { key: node.id, onMouseDown: (e) => {
                    if (tool !== 'select' && tool !== 'pan' && !connectingNodeId) return;
                    e.stopPropagation();

                    const now = Date.now();
                    if (lastClickRef.current.id === node.id && (now - lastClickRef.current.time) < 300) {
                        setEditingLabelId(node.id);
                        setEditingLabelText(node.text);
                        lastClickRef.current = { id: '', time: 0 };
                        return;
                    }
                    lastClickRef.current = { id: node.id, time: now };

                    if (connectingNodeId) {
                        if (connectingNodeId === node.id && activeDiagram?.type === 'dc' && node.type !== 'class') return;
                        const src = nodes.find(n => n.id === connectingNodeId);
                        if (!src) return;
                        const allValidTypes = getValidConnectionTypes(src, node, activeDiagram?.type || 'dcu');
                        if (allValidTypes.length === 0) { showToast("Conexión no válida", 'warning'); return; }
                        const validTypes = filterTypesByExisting(allValidTypes, getEdgesBetween(edges, src.id, node.id), activeDiagram?.type || 'dcu');
                        if (validTypes.length === 0) { showToast("Relación ya existente", 'warning'); return; }

                        if (validTypes.length > 1) {
                            setPendingConnection({ source: src, target: node, validTypes });
                            setConnectingNodeId(null); setTool('select');
                            return;
                        }
                        const defaultType = validTypes[0];
                        let label = '';
                        if (defaultType === 'include') label = '<<include>>';
                        if (defaultType === 'extend') label = '<<extend>>';
                        if (activeDiagram?.type === 'dcu' && (defaultType === 'association' || defaultType === 'generalization')) label = '';

                        const defaultPathType = activeDiagram?.type === 'da' ? 'orthogonal' : 'straight';

                        updateDiagramState(nodes, [...edges, { id: generateId(), source: connectingNodeId, target: node.id, type: defaultType, pathType: defaultPathType, label }]);
                        setConnectingNodeId(null); setTool('select');
                        return;
                    }
                    if (tool === 'select') {
                        if (e.shiftKey) {
                            setNodes(nodes.map(n => n.id === node.id ? { ...n, selected: !n.selected } : n));
                        } else {
                            if (node.selected) { } else {
                                setNodes(nodes.map(n => ({ ...n, selected: n.id === node.id })));
                                setEdges(edges.map(ed => ({ ...ed, selected: false })));
                            }
                        }
                        dragSnapshotRef.current = { nodes, edges };
                        setIsDragging(true);
                        setDragStart(getMousePos(e));
                    }
                },
                className: "cursor-move select-none"
            };

            // Función normal (no componente): un componente definido aquí se remontaría en cada render
            const renderNodeContent = () => {
                switch (node.type) {
                    case 'actor': const sx = node.width/40, sy = node.height/80; return (<g><g transform={`scale(${sx},${sy})`}><circle cx={20} cy={15} r={10} fill={fill} stroke={strokeColor} strokeWidth={strokeWidth/Math.min(sx,sy)} vectorEffect="non-scaling-stroke"/><path d="M20,25 L20,55 M5,35 L35,35 M20,55 L5,80 M20,55 L35,80" stroke={strokeColor} strokeWidth={strokeWidth/Math.min(sx,sy)} vectorEffect="non-scaling-stroke"/></g><text x={node.width/2} y={node.height+20} textAnchor="middle" fill={textFill} fontSize={12}>{node.text}</text><rect width={node.width} height={node.height} fill="transparent"/></g>);
                    case 'usecase': return (<g><ellipse cx={node.width/2} cy={node.height/2} rx={node.width/2} ry={node.height/2} fill={fill} stroke={strokeColor} strokeWidth={strokeWidth}/><text x={node.width/2} y={node.height/2+4} textAnchor="middle" fill={textFill} fontSize={12}>{node.text}</text></g>);

                    // --- CAMBIO QUIRÚRGICO: Renderizado SVG puro para Clases e Interfaces ---
                    case 'class': case 'interface':
                        const attrTextColor = isDarkMode ? '#d1d5db' : '#374151'; // gray-300 : gray-700
                        const lineHeight = 12;
                        // Cálculos para truncar texto si excede el alto
                        const attrH = node.height * 0.6 - 35;
                        const maxAttrLines = Math.max(0, Math.floor(attrH / lineHeight));

                        const methodStartY = node.type === 'interface' ? 35 : node.height * 0.6 + 5;
                        const methodH = node.height - methodStartY - 5;
                        const maxMethodLines = Math.max(0, Math.floor(methodH / lineHeight));

                        return (<g>
                            <rect width={node.width} height={node.height} fill={fill} stroke={strokeColor} strokeWidth={strokeWidth}/>
                            <line x1={0} y1={30} x2={node.width} y2={30} stroke={strokeColor}/>

                            {/* Título */}
                            <text x={node.width/2} y={node.type==='interface'?15:25} textAnchor="middle" fill={textFill} fontSize={12} fontWeight="bold" fontStyle={node.isAbstract ? 'italic' : 'normal'}>{node.text}</text>
                            {node.type==='interface'&&<text x={node.width/2} y={25} textAnchor="middle" fill={textFill} fontSize={10}>&lt;&lt;interface&gt;&gt;</text>}

                            {/* Sección Atributos (Solo Clases) */}
                            {node.type !== 'interface' && (<>
                                <line x1={0} y1={node.height*0.6} x2={node.width} y2={node.height*0.6} stroke={strokeColor}/>
                                {node.attributes?.slice(0, maxAttrLines).map((a, i) => (
                                    <text key={`a-${i}`} x={5} y={35 + 10 + (i * lineHeight)} fill={attrTextColor} fontSize={10} style={{pointerEvents: 'none'}}>{a}</text>
                                ))}
                            </>)}

                            {/* Sección Métodos */}
                            {node.methods?.slice(0, maxMethodLines).map((m, i) => (
                                <text key={`m-${i}`} x={5} y={methodStartY + 10 + (i * lineHeight)} fill={attrTextColor} fontSize={10} style={{pointerEvents: 'none'}}>{m}</text>
                            ))}
                        </g>);
                    // --- FIN CAMBIO QUIRÚRGICO ---

                    case 'boundary':
                        // --- CAMBIO: Pestaña dinámica para el Límite del Sistema ---
                        // 1. Estimamos el ancho del texto (aprox 8px por caracter para negrita 12px)
                        const estTextW = node.text.length * 8 + 10;
                        // 2. Calculamos ancho: Mínimo 100px, pero que crezca con el texto, sin superar el ancho total
                        const tabW = Math.min(node.width, Math.max(100, estTextW));

                        return (<g>
                            <rect width={node.width} height={node.height} fill={isDarkMode?'#111827':'#f9fafb'} stroke={strokeColor} strokeWidth={strokeWidth} strokeDasharray="5,5"/>
                            {/* La línea dibuja el borde inferior y derecho de la pestaña del título */}
                            <path d={`M0,30 L${tabW},30 L${tabW},0`} fill="none" stroke={strokeColor} strokeWidth={strokeWidth}/>
                            <text x={5} y={20} fill={textFill} fontSize={12} fontWeight="bold" style={{pointerEvents: 'none'}}>{node.text}</text>
                        </g>);

                    case 'swimlane': return (<g><rect width={node.width} height={node.height} fill={isDarkMode?'#111827':'#f9fafb'} stroke={strokeColor} strokeWidth={strokeWidth}/><line x1={0} y1={30} x2={node.width} y2={30} stroke={strokeColor}/><text x={5} y={20} fill={textFill} fontSize={12} fontWeight="bold">{node.text}</text></g>);
                    case 'start': return <circle cx={node.width/2} cy={node.height/2} r={15} fill="black" />;
                    case 'end': return (<g><circle cx={node.width/2} cy={node.height/2} r={15} fill="transparent" stroke={strokeColor} strokeWidth={2}/><circle cx={node.width/2} cy={node.height/2} r={10} fill="black"/></g>);
                    case 'decision': return (<g><polygon points={`${node.width/2},0 ${node.width},${node.height/2} ${node.width/2},${node.height} 0,${node.height/2}`} fill={fill} stroke={strokeColor} strokeWidth={strokeWidth}/><text x={node.width/2} y={node.height/2+4} textAnchor="middle" fill={textFill} fontSize={10}>{node.text}</text></g>);
                    case 'fork': return (<g>
                        <rect width={node.width} height={node.height} fill="black" stroke="none" />
                        <text x={node.width/2} y={-10} textAnchor="middle" fill={textFill} fontSize={12}>{node.text}</text>
                    </g>);
                    default: return (<g><rect width={node.width} height={node.height} rx={15} fill={fill} stroke={strokeColor} strokeWidth={strokeWidth}/><text x={node.width/2} y={node.height/2+4} textAnchor="middle" fill={textFill} fontSize={12}>{node.text}</text></g>);
                }
            };

            return ( <g transform={`translate(${node.x},${node.y})`} {...commonProps}> {renderNodeContent()} {isSelected && tool === 'select' && renderResizeHandles(node)} </g> );
          };

          const renderEdges = () => {
            // Posición de cada relación dentro de su grupo (mismo par de nodos), para dibujar separadas las paralelas
            const groupIndex = {}, groupSize = {};
            edges.forEach(ed => {
                const key = [ed.source, ed.target].sort().join('|');
                groupIndex[ed.id] = groupSize[key] || 0;
                groupSize[key] = (groupSize[key] || 0) + 1;
            });

            return edges.map(edge => {
                const s = nodes.find(n => n.id === edge.source), t = nodes.find(n => n.id === edge.target);
                if (!s || !t) return null;
                const edgeSelected = edge.selected && !isExporting;
                const idx = groupIndex[edge.id];
                const count = groupSize[[edge.source, edge.target].sort().join('|')];

                const sCenter = { x: s.x + s.width / 2, y: s.y + s.height / 2 };
                const tCenter = { x: t.x + t.width / 2, y: t.y + t.height / 2 };

                if (s.id === t.id) {
                     // Cada bucle reflexivo de una misma clase va en un lado distinto (y más grande si hay más de cuatro)
                     const side = ['right', 'left', 'top', 'bottom'][idx % 4];
                     const size = 50 + 30 * Math.floor(idx / 4);
                     const sign = (side === 'right' || side === 'bottom') ? 1 : -1;
                     let p1, p2, cp1, cp2, labelPos, labelAnchor;
                     if (side === 'right' || side === 'left') {
                         const x = side === 'right' ? s.x + s.width : s.x;
                         p1 = { x, y: sCenter.y - 15 }; p2 = { x, y: sCenter.y + 15 };
                         cp1 = { x: x + sign * size, y: p1.y }; cp2 = { x: x + sign * size, y: p2.y };
                         labelPos = { x: x + sign * size * 0.8, y: sCenter.y };
                         labelAnchor = side === 'right' ? 'start' : 'end';
                     } else {
                         const y = side === 'bottom' ? s.y + s.height : s.y;
                         p1 = { x: sCenter.x - 15, y }; p2 = { x: sCenter.x + 15, y };
                         cp1 = { x: p1.x, y: y + sign * size }; cp2 = { x: p2.x, y: y + sign * size };
                         labelPos = { x: sCenter.x, y: y + sign * size * 0.8 + (side === 'bottom' ? 11 : -4) };
                         labelAnchor = 'middle';
                     }

                     const d = `M ${p1.x} ${p1.y} C ${cp1.x} ${cp1.y}, ${cp2.x} ${cp2.y}, ${p2.x} ${p2.y}`;

                     let markerId = `arrow-${edge.type}`;
                     if (edgeSelected) markerId += '-selected';
                     let marker = `url(#${markerId})`;
                     if (edge.type === 'association') marker = '';
                     const strokeColor = edgeSelected ? COLORS.selection : (isDarkMode ? '#9ca3af' : '#4b5563');

                     const dashed = ['dependency', 'implementation'].includes(edge.type) ? "5,5" : "";

                     return (
                        <g key={edge.id} onClick={(e) => { e.stopPropagation(); setNodes(nodes.map(n => ({...n, selected: false}))); setEdges(edges.map(ed => ({...ed, selected: ed.id === edge.id}))); }} className="cursor-pointer">
                            <path d={d} fill="none" stroke="transparent" strokeWidth={15} />
                            <path d={d} fill="none" stroke={strokeColor} strokeWidth={2} markerEnd={marker} strokeDasharray={dashed} />
                            {edge.label && <text x={labelPos.x} y={labelPos.y} textAnchor={labelAnchor} fill={strokeColor} fontSize={11} paintOrder="stroke" stroke={isDarkMode ? COLORS.nodeBgDark : COLORS.nodeBg} strokeWidth="3px">{edge.label}</text>}
                        </g>
                     );
                }

                const dx = tCenter.x - sCenter.x;
                const dy = tCenter.y - sCenter.y;
                const isVertical = Math.abs(dy) > Math.abs(dx);

                let refStart = tCenter;
                let refEnd = sCenter;

                if (edge.pathType === 'orthogonal') {
                     if (isVertical) {
                         refStart = { x: sCenter.x, y: sCenter.y + dy/2 };
                         refEnd = { x: tCenter.x, y: tCenter.y - dy/2 };
                     } else {
                         refStart = { x: sCenter.x + dx/2, y: sCenter.y };
                         refEnd = { x: tCenter.x - dx/2, y: tCenter.y };
                     }
                }

                // Relaciones paralelas: se desplaza cada una perpendicularmente, de forma simétrica respecto al eje.
                // La dirección se calcula sobre el par ordenado para que A→B y B→A se repartan igual.
                const PARALLEL_GAP = 18;
                const offset = (idx - (count - 1) / 2) * PARALLEL_GAP;
                let offv = { x: 0, y: 0 };
                if (offset !== 0) {
                    if (edge.pathType === 'orthogonal') {
                        offv = isVertical ? { x: offset, y: 0 } : { x: 0, y: offset };
                    } else {
                        const [a, b] = edge.source < edge.target ? [sCenter, tCenter] : [tCenter, sCenter];
                        const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
                        offv = { x: -(b.y - a.y) / len * offset, y: (b.x - a.x) / len * offset };
                    }
                }
                const shiftNode = (n) => ({ ...n, x: n.x + offv.x, y: n.y + offv.y });
                const shiftPoint = (p) => ({ x: p.x + offv.x, y: p.y + offv.y });

                const start = calculatePerimeterPoint(shiftNode(s), shiftPoint(refStart));
                const end = calculatePerimeterPoint(shiftNode(t), shiftPoint(refEnd));
                // En ortogonales, el tramo intermedio también se desplaza (en el sentido que evita cruces)
                const midShift = -offset * (Math.sign(end.x - start.x) || 1) * (Math.sign(end.y - start.y) || 1);

                let d = '';
                let mid1, mid2;

                if (edge.pathType === 'straight') {
                    d = `M ${start.x} ${start.y} L ${end.x} ${end.y}`;
                    mid1 = start;
                    mid2 = end;
                } else {
                    if (isVertical) {
                        const midY = (start.y + end.y) / 2 + midShift;
                        d = `M ${start.x} ${start.y} L ${start.x} ${midY} L ${end.x} ${midY} L ${end.x} ${end.y}`;
                        mid1 = {x: start.x, y: midY};
                        mid2 = {x: end.x, y: midY};
                    } else {
                        const midX = (start.x + end.x) / 2 + midShift;
                        d = `M ${start.x} ${start.y} L ${midX} ${start.y} L ${midX} ${end.y} L ${end.x} ${end.y}`;
                        mid1 = {x: midX, y: start.y};
                        mid2 = {x: midX, y: end.y};
                    }
                }

                let markerId = `arrow-${edge.type}`;
                if (edgeSelected) markerId += '-selected';

                let marker = `url(#${markerId})`;
                if (edge.type === 'association') marker = '';
                if (edge.type === 'include' || edge.type === 'extend') marker = `url(#arrow-dependency${edgeSelected ? '-selected' : ''})`;
                if (edge.type === 'implementation') marker = `url(#arrow-generalization${edgeSelected ? '-selected' : ''})`;
                if (edge.type === 'control') marker = `url(#arrow-directed_association${edgeSelected ? '-selected' : ''})`;

                const dashed = ['include', 'extend', 'dependency', 'implementation'].includes(edge.type) ? "5,5" : "";
                const showLabel = activeDiagram?.type === 'dcu' ? (edge.type === 'include' || edge.type === 'extend') : (edge.label || edge.type === 'include' || edge.type === 'extend');

                const strokeColor = edgeSelected ? COLORS.selection : (isDarkMode ? '#9ca3af' : '#4b5563');

                // Multiplicity Positions
                const nextPoint = (edge.pathType === 'straight') ? end : mid1;
                const prevPoint = (edge.pathType === 'straight') ? start : mid2;

                // Etiqueta: sobre el punto medio; en relaciones paralelas, en su lado exterior para no confundirlas
                const mid = { x: (start.x + end.x) / 2, y: (start.y + end.y) / 2 };
                let labelPos = { x: mid.x, y: mid.y - 10 }, labelAnchor = 'middle';
                if (offset !== 0) {
                    const ux = offv.x / Math.abs(offset), uy = offv.y / Math.abs(offset);
                    const sideways = Math.abs(ux) > 0.3;
                    labelPos = { x: mid.x + ux * 12, y: mid.y + uy * 12 + (uy > 0.3 ? 9 : 0) + (sideways && Math.abs(uy) <= 0.3 ? 4 : 0) };
                    labelAnchor = sideways ? (ux > 0 ? 'start' : 'end') : 'middle';
                }

                // En relaciones paralelas, las multiplicidades también van en el lado exterior
                const sideOffset = (from, to, base) => {
                    if (offset === 0) return base;
                    const a = Math.atan2(to.y - from.y, to.x - from.x);
                    const dot = Math.cos(a - Math.PI / 2) * offv.x + Math.sin(a - Math.PI / 2) * offv.y;
                    return (Math.sign(dot) || 1) * Math.abs(base);
                };
                const startLabelPos = getMultiplicityPos(start, nextPoint, 15, sideOffset(start, nextPoint, 10));
                const endLabelPos = getMultiplicityPos(end, prevPoint, 15, sideOffset(end, prevPoint, -10));

                const textStyle = {
                    paintOrder: 'stroke',
                    stroke: isDarkMode ? COLORS.nodeBgDark : COLORS.nodeBg,
                    strokeWidth: '3px',
                    fill: strokeColor,
                    fontSize: 11,
                    fontWeight: 500
                };

                return (
                    <g key={edge.id} onClick={(e) => {
                        e.stopPropagation();
                        setNodes(nodes.map(n => ({...n, selected: false})));
                        setEdges(edges.map(ed => ({...ed, selected: ed.id === edge.id})));
                    }} className="cursor-pointer">
                        <path d={d} fill="none" stroke="transparent" strokeWidth={15} />
                        <path d={d} fill="none" stroke={strokeColor} strokeWidth={2} markerEnd={marker} strokeDasharray={dashed} />
                        {showLabel && <text x={labelPos.x} y={labelPos.y} textAnchor={labelAnchor} {...textStyle} strokeWidth="4px" style={{}}>{edge.label}</text>}

                        {/* Etiquetas de Multiplicidad */}
                        {activeDiagram?.type === 'dc' && edge.sourceLabel && ['association', 'directed_association', 'aggregation', 'composition'].includes(edge.type) && (
                            <text x={startLabelPos.x} y={startLabelPos.y} textAnchor="middle" dominantBaseline="middle" {...textStyle}>{edge.sourceLabel}</text>
                        )}
                        {activeDiagram?.type === 'dc' && edge.targetLabel && ['association', 'directed_association', 'aggregation', 'composition'].includes(edge.type) && (
                            <text x={endLabelPos.x} y={endLabelPos.y} textAnchor="middle" dominantBaseline="middle" {...textStyle}>{edge.targetLabel}</text>
                        )}
                    </g>
                );
            });
          };

          // --- RENDER COMPONENTES UI ---
          const renderToolbar = () => (
            <div className={`h-12 border-b flex items-center px-4 justify-between select-none ${isDarkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-200 text-gray-800'}`}>
              <div className="flex items-center space-x-2">
                <span className="font-bold text-lg mr-4 bg-gradient-to-r from-blue-500 to-indigo-600 bg-clip-text text-transparent">Arquitecto Simple UML</span>
                <div className="flex bg-gray-100 dark:bg-gray-700 rounded p-1">
                    <button onClick={handleCreateFolder} className="p-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded flex items-center gap-1 px-2" title="Nueva carpeta">
                        <FolderPlus size={18}/>
                    </button>
                    <button onClick={() => openNewDiagramModal(folders[0]?.id || 'root')} className="p-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded flex items-center gap-1 px-2" title="Nuevo diagrama (Raíz)">
                        <FilePlus size={18}/>
                    </button>
                    <div className="w-px h-6 bg-gray-300 dark:bg-gray-600 mx-1"></div>
                    {/* Input de archivo oculto */}
                    <input type="file" ref={fileInputRef} onChange={handleImportFile} accept=".json" className="hidden" />

                    <button onClick={handleImportClick} className="p-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded" title="Abrir (Importar JSON)">
                        <Upload size={18}/>
                    </button>
                    <button onClick={handleExportJSON} className="p-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded" title="Guardar (Exportar JSON)">
                        <Download size={18}/>
                    </button>
                    <button onClick={() => setOpenSharedText('')} className="p-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded" title="Abrir diagrama compartido (pegar enlace)">
                        <Link2 size={18}/>
                    </button>
                    <button onClick={handleExportPNG} className={`p-1 hover:bg-gray-200 dark:hover:bg-gray-600 rounded ${!activeDiagram ? 'opacity-50 cursor-not-allowed' : ''}`} title="Exportar como imagen (PNG)">
                        <ImageIcon size={18}/>
                    </button>
                </div>
                <div className="w-px h-6 bg-gray-300 dark:bg-gray-600 mx-2"></div>
                <div className="flex space-x-1">

Diagram.type === 'da' && ( <> <ToolBtn icon={<Circle className="fill-current"/>} label="Inicio" onClick={() => setTool('start')} active={tool === 'start'} /> <ToolBtn icon={<Circle className="border-2"/>} label="Fin" onClick={() => setTool('end')} active={tool === 'end'} /> <ToolBtn icon={<Square className="rounded-lg"/>} label="Actividad" onClick={() => setTool('activity')} active={tool === 'activity'} /> <ToolBtn icon={<Diamond/>} label="Decisión" onClick={() => setTool('decision')} active={tool === 'decision'} /> <ToolBtn icon={<Minus className="rotate-90"/>} label="Bifurcación / Unión" onClick={() => setTool('fork')} active={tool === 'fork'} /> <ToolBtn icon={<GripVertical/>} label="Carril" onClick={() => setTool('swimlane')} active={tool === 'swimlane'} /> </> )} </div> </> ) : ( <p className="text-sm text-center opacity-50 mt-10">Selecciona o crea un diagrama para ver las herramientas.</p> )} </div> </div>
            </div>

                const edge = sE[0], s = nodes.find(n => n.id === edge.source), t = nodes.find(n => n.id === edge.target);
                if (s && t) allowed = getValidConnectionTypes(s, t, 'dcu').map(type => ({ value: type, label: getEdgeLabel(type) }));
            } else if (sE.length === 1 && activeDiagram?.type === 'dc') {

                const others = s && t ? getEdgesBetween(edges, s.id, t.id).filter(ed => ed.id !== edge.id) : [];
                if (s && t) allowed = filterTypesByExisting(getValidConnectionTypes(s, t, 'dc'), others, 'dc').map(type => ({ value: type, label: getEdgeLabel(type) }));

            const isReflexive = currentEdge ? currentEdge.source === currentEdge.target : false;

            const showMultiplicity = currentEdge && ['association', 'directed_association', 'aggregation', 'composition'].includes(currentEdge.type) && !(currentEdge.type === 'association' && isReflexive);

            const sourceNode = currentEdge ? nodes.find(n => n.id === currentEdge.source) : null;
            const targetNode = currentEdge ? nodes.find(n => n.id === currentEdge.target) : null;
            const isClassToInterface = (sourceNode?.type === 'class' && targetNode?.type === 'interface');

            const enableInvert = currentEdge && !isClassToInterface && ['generalization', 'directed_association', 'aggregation', 'composition', 'dependency', 'include', 'extend', 'implementation'].includes(currentEdge.type);

                            </div>

                            <button onClick={duplicateSelection} className={`w-full py-2 rounded text-sm font-medium flex items-center justify-center gap-2 transition-all ${isDarkMode ? 'bg-gray-700 hover:bg-gray-600 text-white' : 'bg-gray-100 hover:bg-gray-200 text-gray-800'}`}>
                                <Copy size={14}/> Duplicar Selección <span className="opacity-60 text-xs">({MOD_KEY}+D)</span>

                            <div className="text-xs text-center mt-4 opacity-50">

                            </div>
                        </div>

                    {sN.length === 1 && (
                        <div className="space-y-4">
                            <div> <label className="block text-xs font-medium mb-1">Texto / Nombre</label> <input type="text" value={sN[0].text} onFocus={beginTextEdit} onChange={(e) => updateFromTextEdit(nodes.map(n => n.id === sN[0].id ? { ...n, text: e.target.value } : n), edges)} className={`w-full p-2 rounded text-sm border ${isDarkMode ? 'bg-gray-800 border-gray-600' : 'bg-gray-50 border-gray-300'}`}/> </div>
                            {(sN[0].type === 'class' || sN[0].type === 'interface') && ( <>
                                {sN[0].type === 'class' && (
                                    <div className="flex items-center space-x-2">

                                        <label htmlFor="isAbstract" className="text-xs font-medium flex items-center gap-1"><Italic size={12}/> Es Abstracta</label>

                                    <div><label className="block text-xs font-medium mb-1">Atributos</label><textarea rows={3} value={sN[0].attributes?.join('\n')} onFocus={beginTextEdit} onChange={(e) => updateFromTextEdit(nodes.map(n => n.id === sN[0].id ? { ...n, attributes: e.target.value.split('\n') } : n), edges)} className={`w-full p-2 rounded text-sm border ${isDarkMode ? 'bg-gray-800 border-gray-600' : 'bg-gray-50 border-gray-300'}`} /></div>
                                )}
                                <div><label className="block text-xs font-medium mb-1">Métodos</label><textarea rows={3} value={sN[0].methods?.join('\n')} onFocus={beginTextEdit} onChange={(e) => updateFromTextEdit(nodes.map(n => n.id === sN[0].id ? { ...n, methods: e.target.value.split('\n') } : n), edges)} className={`w-full p-2 rounded text-sm border ${isDarkMode ? 'bg-gray-800 border-gray-600' : 'bg-gray-50 border-gray-300'}`} /></div> </>
                            )}
                            {sN[0].type !== 'boundary' && sN[0].type !== 'swimlane' && (
                                <button
                                    onClick={() => setConnectingNodeId(sN[0].id)}

                                >

                             <div className="border-t pt-4 mt-4 border-gray-200 dark:border-gray-700 space-y-2">

                                    <Copy size={14}/> Duplicar <span className="opacity-60 text-xs">({MOD_KEY}+D)</span>

                                    <Trash2 size={14}/> Eliminar <span className="opacity-60 text-xs">(Supr)</span>
                                </button>

                            )}

                            <div> <label className="block text-xs font-medium mb-1">Estilo de línea</label> <select value={sE[0].pathType} onChange={(e) => updateDiagramState(nodes, edges.map(ed => ed.id === sE[0].id ? { ...ed, pathType: e.target.value } : ed))} className={`w-full p-2 rounded text-sm border ${isDarkMode ? 'bg-gray-800 border-gray-600' : 'bg-gray-50 border-gray-300'}`}> <option value="straight">Recta</option> <option value="orthogonal">Ortogonal</option> </select> </div>

                            {!(activeDiagram?.type === 'dcu' && (sE[0].type === 'association' || sE[0].type === 'generalization')) && ( <div> <label className="block text-xs font-medium mb-1">Etiqueta</label> <input type="text" disabled={sE[0].type === 'include' || sE[0].type === 'extend'} value={sE[0].label || ''} onFocus={beginTextEdit} onChange={(e) => updateFromTextEdit(nodes, edges.map(ed => ed.id === sE[0].id ? { ...ed, label: e.target.value } : ed))} className={`w-full p-2 rounded text-sm border ${isDarkMode ? 'bg-gray-800 border-gray-600' : 'bg-gray-50 border-gray-300'} disabled:opacity-50`}/> </div> )}

                                    <span>Hay otra asociación entre estas clases con la misma etiqueta. Usa etiquetas distintas (p. ej. «origen» y «destino») para diferenciarlas.</span>
                                </div>

                            {activeDiagram?.type === 'dc' && showMultiplicity && (
                                <div className="grid grid-cols-2 gap-2">
                                    <div><label className="block text-xs font-medium mb-1">Mult. origen</label><input type="text" placeholder="1" value={sE[0].sourceLabel || ''} onFocus={beginTextEdit} onChange={(e) => updateFromTextEdit(nodes, edges.map(ed => ed.id === sE[0].id ? { ...ed, sourceLabel: e.target.value } : ed))} className={`w-full p-1 rounded text-sm border ${isDarkMode ? 'bg-gray-800 border-gray-600' : 'bg-gray-50 border-gray-300'}`}/></div>
                                    <div><label className="block text-xs font-medium mb-1">Mult. destino</label><input type="text" placeholder="*" value={sE[0].targetLabel || ''} onFocus={beginTextEdit} onChange={(e) => updateFromTextEdit(nodes, edges.map(ed => ed.id === sE[0].id ? { ...ed, targetLabel: e.target.value } : ed))} className={`w-full p-1 rounded text-sm border ${isDarkMode ? 'bg-gray-800 border-gray-600' : 'bg-gray-50 border-gray-300'}`}/></div>

                        </div>
                    )}
                </div>

          // Con cambios sin exportar no se puede ocultar.
          const renderStorageNotice = () => {
            if (!IS_EPHEMERAL_STORAGE || (storageNoticeCollapsed && !hasUnexportedChanges)) return null;
            const tone = hasUnexportedChanges
                ? (isDarkMode ? 'bg-amber-900/60 border-amber-700 text-amber-100' : 'bg-amber-100 border-amber-300 text-amber-900')
                : (isDarkMode ? 'bg-gray-800 border-gray-700 text-gray-300' : 'bg-blue-50 border-blue-200 text-blue-900');
            return (
                <div role={hasUnexportedChanges ? 'alert' : 'status'} className={`px-4 py-2 border-b text-sm flex items-center gap-3 ${tone}`}>
                    <AlertTriangle size={16} className="flex-shrink-0"/>
                    <span className="flex-1">
                        {hasUnexportedChanges
                            ? <><strong>Tienes cambios sin exportar.</strong> En esta versión los diagramas no se conservan al recargar o cerrar la página: exporta una copia (JSON) para no perderlos.</>
                            : <>En esta versión los diagramas no se conservan al recargar o cerrar la página. Antes de salir, exporta una copia (JSON) con <strong>Guardar</strong>.</>}
                    </span>
                    {hasUnexportedChanges ? (
                        <button onClick={handleExportJSON} className="px-3 py-1 rounded bg-amber-800 hover:bg-amber-900 text-white font-medium flex items-center gap-1 flex-shrink-0"><Download size={14}/> Exportar ahora</button>
                    ) : (
                        <button onClick={() => setStorageNoticeCollapsed(true)} className="p-1 rounded hover:bg-black/10 flex-shrink-0" title="Ocultar aviso"><X size={14}/></button>
                    )}
                </div>
            );
          };

          return (
            <div className={`flex flex-col h-screen w-full overflow-hidden select-none ${isDarkMode ? 'bg-gray-900 text-white' : 'bg-white text-black'}`}>
              {renderToolbar()}
              {renderStorageNotice()}
              <div className="flex flex-1 overflow-hidden relative">
                {renderSidebar()}
                <div ref={canvasRef} className={`flex-1 relative overflow-hidden ${isDarkMode ? 'bg-gray-800' : 'bg-gray-100'} ${connectingNodeId ? 'cursor-crosshair' : (tool === 'pan' || (isDragging && tool === 'pan')) ? 'cursor-grab' : 'default'}`} onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}>
                    <div className="absolute inset-0 pointer-events-none opacity-20" style={{ backgroundImage: `radial-gradient(${isDarkMode ? '#6b7280' : '#9ca3af'} 1px, transparent 1px)`, backgroundSize: `${20 * scale}px ${20 * scale}px`, backgroundPosition: `${pan.x}px ${pan.y}px` }} />
                    <svg ref={svgRef} className="w-full h-full block touch-none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            {/* Marcadores SVG (Flechas) */}
                            <marker id="arrow-association" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill={isDarkMode ? '#9ca3af' : '#4b5563'} opacity="0"/></marker>
                            <marker id="arrow-directed_association" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill={isDarkMode ? '#9ca3af' : '#4b5563'} stroke={isDarkMode ? '#9ca3af' : '#4b5563'} strokeWidth={1} /></marker>
                            <marker id="arrow-generalization" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill={isDarkMode ? '#1f2937' : '#ffffff'} stroke={isDarkMode ? '#9ca3af' : '#4b5563'} strokeWidth={1.5} /></marker>
                            <marker id="arrow-composition" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,4.5 L4.5,0 L9,4.5 L4.5,9 z" fill={isDarkMode ? '#9ca3af' : '#4b5563'} stroke={isDarkMode ? '#9ca3af' : '#4b5563'} /></marker>
                            <marker id="arrow-aggregation" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,4.5 L4.5,0 L9,4.5 L4.5,9 z" fill={isDarkMode ? '#1f2937' : '#ffffff'} stroke={isDarkMode ? '#9ca3af' : '#4b5563'} strokeWidth={1.5} /></marker>
                            <marker id="arrow-dependency" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke={isDarkMode ? '#9ca3af' : '#4b5563'} strokeWidth={1.5} /></marker>
                            <marker id="arrow-include" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke={isDarkMode ? '#9ca3af' : '#4b5563'} strokeWidth={1.5} /></marker>
                            <marker id="arrow-extend" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke={isDarkMode ? '#9ca3af' : '#4b5563'} strokeWidth={1.5} /></marker>
                            <marker id="arrow-implementation" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill={isDarkMode ? '#1f2937' : '#ffffff'} stroke={isDarkMode ? '#9ca3af' : '#4b5563'} strokeWidth={1.5} strokeDasharray="5,5"/></marker>

                            <marker id="arrow-association-selected" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L0,9 L9,4.5 z" fill={COLORS.selection} opacity="0"/></marker>
                            <marker id="arrow-directed_association-selected" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill={COLORS.selection} stroke={COLORS.selection} strokeWidth={1} /></marker>
                            <marker id="arrow-generalization-selected" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill={isDarkMode ? '#1f2937' : '#ffffff'} stroke={COLORS.selection} strokeWidth={1.5} /></marker>
                            <marker id="arrow-composition-selected" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,4.5 L4.5,0 L9,4.5 L4.5,9 z" fill={COLORS.selection} stroke={COLORS.selection} /></marker>
                            <marker id="arrow-aggregation-selected" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,4.5 L4.5,0 L9,4.5 L4.5,9 z" fill={isDarkMode ? '#1f2937' : '#ffffff'} stroke={COLORS.selection} strokeWidth={1.5} /></marker>
                            <marker id="arrow-dependency-selected" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke={COLORS.selection} strokeWidth={1.5} /></marker>
                            <marker id="arrow-include-selected" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke={COLORS.selection} strokeWidth={1.5} /></marker>
                            <marker id="arrow-extend-selected" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke={COLORS.selection} strokeWidth={1.5} /></marker>
                            <marker id="arrow-implementation-selected" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill={isDarkMode ? '#1f2937' : '#ffffff'} stroke={COLORS.selection} strokeWidth={1.5} strokeDasharray="5,5"/></marker>

                            <marker id="arrow-control" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill={isDarkMode ? '#9ca3af' : '#4b5563'} stroke="none" /></marker>
                            <marker id="arrow-control-selected" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill={COLORS.selection} stroke="none" /></marker>
                        </defs>
                        <g transform={`translate(${pan.x}, ${pan.y}) scale(${scale})`}>
                            {nodes.filter(n => n.zIndex === 0).map(renderNode)}
                            {renderEdges()}
                            {nodes.filter(n => n.zIndex > 0).map(renderNode)}
                            {smartGuides.map((guide, i) => ( guide.type === 'x' ? <line key={i} x1={guide.pos} y1={-10000} x2={guide.pos} y2={10000} stroke="#ef4444" strokeWidth={1} strokeDasharray="4,2"/> : <line key={i} x1={-10000} y1={guide.pos} x2={10000} y2={guide.pos} stroke="#ef4444" strokeWidth={1} strokeDasharray="4,2"/> ))}
                            {selectionBox && ( <rect x={Math.min(selectionBox.start.x, selectionBox.end.x)} y={Math.min(selectionBox.start.y, selectionBox.end.y)} width={Math.abs(selectionBox.end.x - selectionBox.start.x)} height={Math.abs(selectionBox.end.y - selectionBox.start.y)} fill={COLORS.selection} fillOpacity={0.1} stroke={COLORS.selection} /> )}
                        </g>
                    </svg>
                    {connectingNodeId && ( <div className="absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-4 py-2 rounded-full shadow-lg flex items-center space-x-3 z-50 animate-bounce-in"> <Link2 size={18} className="animate-pulse"/> <span className="text-sm font-medium">Modo Conexión: Selecciona el destino</span> <button onClick={() => setConnectingNodeId(null)} className="ml-2 bg-blue-700 p-1 rounded-full hover:bg-blue-800"><X size={14}/></button> </div> )}
                    {toastMessage && ( <div role={toastMessage.kind === 'error' ? 'alert' : 'status'} className={`absolute top-4 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded shadow-lg z-[110] text-sm font-medium max-w-[90%] text-center ${TOAST_STYLES[toastMessage.kind] || TOAST_STYLES.info}`}> {toastMessage.text} </div> )}
                    {!activeDiagram && ( <div className="absolute inset-0 flex items-center justify-center bg-gray-900 bg-opacity-50 text-white z-50"> <div className="bg-gray-800 p-8 rounded shadow-2xl text-center"> <h2 className="text-2xl font-bold mb-4">Bienvenido a Arquitecto Simple UML</h2>
                        {folders.some(f => f.diagrams.length > 0) ? (<>
                            <p className="mb-4">Selecciona un diagrama a la izquierda o crea uno nuevo.</p>
                            <button onClick={() => openNewDiagramModal(folders[0]?.id || 'root')} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-bold">Crear nuevo diagrama</button>
                        </>) : (<>
                            <p className="mb-4">Todavía no tienes ningún diagrama. Empieza creando el primero.</p>
                            <button onClick={() => openNewDiagramModal(folders[0]?.id || 'root')} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-bold">Crear mi primer diagrama</button>
                            <button onClick={handleImportClick} className="block mx-auto mt-3 text-sm text-blue-300 hover:text-blue-200 hover:underline">o importa una copia de seguridad (JSON)</button>
                            <button onClick={() => setOpenSharedText('')} className="block mx-auto mt-1 text-sm text-blue-300 hover:text-blue-200 hover:underline">o abre un diagrama compartido</button>
                        </>)}
                    </div> </div> )}

                    <RenameModal
                        isOpen={editingLabelId !== null}
                        initialText={editingLabelText}
                        title="Editar Texto"
                        onClose={() => setEditingLabelId(null)}
                        onSave={(newText) => {
                            if (editingLabelId) {
                                updateDiagramState(nodes.map(n => n.id === editingLabelId ? { ...n, text: newText } : n), edges);
                                setEditingLabelId(null);
                            }
                        }}
                        isDarkMode={isDarkMode}
                    />

                    <ConnectionModal pendingConnection={pendingConnection} onConfirm={(type) => {
                        if (!pendingConnection) return;
                        const { source, target } = pendingConnection;
                        let label = '';
                        if (type === 'include') label = '<<include>>';
                        if (type === 'extend') label = '<<extend>>';
                        const defaultPathType = activeDiagram?.type === 'da' ? 'orthogonal' : 'straight';
                        updateDiagramState(nodes, [...edges, { id: generateId(), source: source.id, target: target.id, type, pathType: defaultPathType, label }]);
                        setPendingConnection(null); setTool('select');
                    }} onCancel={() => { setPendingConnection(null); setTool('select'); }} isDarkMode={isDarkMode} />
                    <NewDiagramModal isOpen={creatingDiagramInFolderId !== null} onClose={() => setCreatingDiagramInFolderId(null)} onCreate={handleCreateDiagram} isDarkMode={isDarkMode} />

                    <RenameModal
                        isOpen={renamingId !== null}
                        initialText={renamingId?.initialText || ''}
                        title={renamingId?.type === 'folder' ? 'Nombre de la carpeta' : 'Nombre del diagrama'}
                        onSave={saveRename}
                        onClose={() => setRenamingId(null)}
                        isDarkMode={isDarkMode}
                    />

                    <InfoModal isOpen={showInfoModal} onClose={() => setShowInfoModal(false)} isDarkMode={isDarkMode} />
                    <ShortcutsModal isOpen={showShortcuts} onClose={() => setShowShortcuts(false)} isDarkMode={isDarkMode} />

                    <ShareLinkModal isOpen={shareLink !== undefined} link={shareLink} diagramName={activeDiagram?.name || ''} onCopy={handleCopyShareLink} onClose={() => setShareLink(undefined)} isDarkMode={isDarkMode} />
                    <ImportModeModal pendingImport={pendingImport} currentCount={folders.reduce((n, f) => n + f.diagrams.length, 0)} onAppend={() => applyImport(pendingImport, 'append')} onReplace={() => applyImport(pendingImport, 'replace')} onCancel={() => setPendingImport(null)} isDarkMode={isDarkMode} />
                    <OpenSharedModal isOpen={openSharedText !== null} initialText={openSharedText} onOpen={handleOpenShared} onClose={() => setOpenSharedText(null)} isDarkMode={isDarkMode} />
                </div>
                {showProperties && renderPropertiesPanel()}

                {deleteConfirm && (
                    <div className="absolute inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm" onMouseDown={(e)=>e.stopPropagation()}>
                        <div className={`p-6 rounded-lg shadow-xl border w-80 text-center transform transition-all scale-100 ${isDarkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-200 text-gray-800'}`}>
                            <div className="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 mb-4"><AlertTriangle className="h-6 w-6 text-red-600" /></div>
                            <h3 className="text-lg leading-6 font-medium mb-2">¿Eliminar {deleteConfirm.type === 'folder' ? 'carpeta' : 'diagrama'}?</h3>
                            <p className="text-sm opacity-70 mb-4">Vas a eliminar "{deleteConfirm.name}". {deleteConfirm.type === 'folder' && 'Esto borrará todos los diagramas que contiene.'} Esta acción no se puede deshacer.</p>
                            <div className="flex justify-center space-x-3 mt-4">
                                <button onClick={() => setDeleteConfirm(null)} className="inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:text-sm">Cancelar</button>
                                <button onClick={confirmDelete} className="inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none sm:text-sm">Eliminar</button>
                            </div>
                        </div>
                    </div>
                )}
              </div>
            </div>
          );
        }

        // --- RENDERIZAR LA APLICACIÓN ---
        const root = createRoot(document.getElementById('root'));
        root.render(<ArquitectoUML />);
    </script>
</body>
</html>
