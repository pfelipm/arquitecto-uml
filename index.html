<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquitecto Simple UML</title>

    <!-- 1. Cargar Tailwind CSS -->
    <!-- Versión fijada para que una actualización del CDN no cambie ni rompa la interfaz -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <!-- Configuración para modo oscuro de Tailwind -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- 2. Import Map para gestionar las bibliotecas de React y Lucide -->
    <!-- Esto le dice al navegador dónde buscar "react" y "lucide-react" -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>

    <!-- 3. Cargar Babel para traducir TSX a JS en el navegador -->
    <!-- Versión fijada: Babel 8 no aplica el preset de TypeScript a scripts en línea -->
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>

    <style>
        /* Ajustes básicos para asegurar que ocupe el iframe de Google Sites */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #root { height: 100%; }

        /* Animaciones personalizadas del código original */
        @keyframes bounce-in {
            0% { transform: translate(-50%, 100%); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }
        .animate-bounce-in {
            animation: bounce-in 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- 4. Tu código de la aplicación -->
    <!-- data-type="module" permite usar imports -->
    <!-- data-presets="react,typescript" permite usar código React y Typescript -->
    <script type="text/babel" data-type="module" data-presets="react,typescript">
        import React, { useState, useRef, useEffect, useCallback, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import {
          MousePointer2, Move, Square, Circle, Diamond,
          Minus, ArrowRight, Save, Download, Folder,
          Trash2, Plus, GripVertical, ZoomIn, ZoomOut,
          Undo, Redo, Moon, Sun, ChevronRight, ChevronDown,
          Maximize2, Copy, User, Edit2, ArrowDownAZ,
          AlertTriangle, X, Link2, ArrowLeftRight, Italic,
          FolderPlus, FilePlus, Layout, Upload, Image as ImageIcon,
          Info, Github, Linkedin, Keyboard
        } from 'lucide-react';

        // --- CÓDIGO ORIGINAL DE LA APP (Sin modificaciones lógicas) ---

        /**
         * ARQUITECTO SIMPLE UML - SUITE DE MODELADO
         * Versión 7.6 "Compartir"
         */

        // --- TIPOS Y CONSTANTES ---

        type DiagramType = 'dcu' | 'dc' | 'da';
        type NodeType =
          | 'actor' | 'usecase' | 'boundary' // DCU
          | 'class' | 'interface' // DC
          | 'start' | 'end' | 'activity' | 'decision' | 'fork' | 'swimlane'; // DA
        type EdgeType = 'association' | 'directed_association' | 'generalization' | 'implementation' | 'include' | 'extend' | 'aggregation' | 'composition' | 'dependency' | 'control';
        type PathType = 'straight' | 'orthogonal';
        type ResizeHandleType = 'nw' | 'ne' | 'sw' | 'se' | 'n' | 's' | 'e' | 'w';

        interface Point { x: number; y: number; }
        interface NodeData {
          id: string;
          type: NodeType;
          x: number;
          y: number;
          width: number;
          height: number;
          text: string;
          attributes?: string[];
          methods?: string[];
          isAbstract?: boolean;
          zIndex: number;
          selected?: boolean;
        }

        interface EdgeData {
          id: string;
          source: string;
          target: string;
          type: EdgeType;
          pathType: PathType;
          label?: string;
          sourceLabel?: string;
          targetLabel?: string;
          waypoints?: Point[];
          selected?: boolean;
        }

        interface Diagram {
          id: string;
          name: string;
          type: DiagramType;
          nodes: NodeData[];
          edges: EdgeData[];
          createdAt: number;
        }

        interface FolderData {
          id: string;
          name: string;
          diagrams: Diagram[];
          isOpen: boolean;
        }

        // Colores y Estilos
        const COLORS = {
          primary: '#3b82f6',
          selection: '#3b82f6',
          grid: '#e5e7eb',
          gridDark: '#374151',
          nodeBg: '#ffffff',
          nodeBgDark: '#1f2937',
          nodeBorder: '#000000',
          nodeBorderDark: '#e5e7eb',
          text: '#000000',
          textDark: '#ffffff'
        };

        // --- ICONOS PERSONALIZADOS ---

        const DiagramIcon = ({ type, size = 16, className = "" }: { type: DiagramType, size?: number, className?: string }) => {
            if (type === 'dcu') {
                return (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <circle cx="12" cy="7" r="4" />
                        <path d="M5.5 21v-2a4 4 0 0 1 4-4h5a4 4 0 0 1 4 4v2" />
                    </svg>
                );
            } else if (type === 'dc') {
                return (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <line x1="3" y1="9" x2="21" y2="9" />
                        <line x1="3" y1="15" x2="21" y2="15" />
                    </svg>
                );
            } else {
                return (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <circle cx="6" cy="6" r="3" />
                        <path d="M6 9v3a6 6 0 0 0 6 6h3" />
                        <path d="M16 22l4-4-4-4" />
                    </svg>
                );
            }
        };

        const InterfaceToolIcon = ({ size = 20 }: { size?: number }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <circle cx="16" cy="6" r="1.5" fill="currentColor" stroke="none" />
            </svg>
        );

        const ClassToolIcon = ({ size = 20 }: { size?: number }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                <line x1="3" y1="9" x2="21" y2="9" />
                <line x1="3" y1="15" x2="21" y2="15" />
            </svg>
        );


        // --- COMPONENTES AUXILIARES Y MATEMÁTICAS ---

        const generateId = () => Math.random().toString(36).substr(2, 9);

        // Dirección pública de la aplicación (base de los enlaces para compartir)
        const APP_URL = 'https://umlsimple.pablofelip.online';

        // --- COMPARTIR DIAGRAMAS POR ENLACE ---
        // El diagrama se comprime (deflate) y viaja en el fragmento de la URL (#d=...), que nunca se envía a ningún servidor.
        // En Google Sites la app corre en un iframe que no puede leer la URL de la página, así que el enlace también
        // puede pegarse en "Abrir diagrama compartido".
        const SHARE_HASH_PREFIX = '#d=';
        const SHARE_LONG_LINK = 8000; // A partir de aquí algunos servicios pueden recortar el enlace
        const SHARED_FOLDER_NAME = 'Diagramas compartidos';

        // Insertada como código en Google Sites, la app corre en un subdominio aleatorio que cambia en cada carga
        // (p. ej. 167002356-atari-embeds.googleusercontent.com), así que localStorage empieza vacío en cada visita
        const IS_EPHEMERAL_STORAGE = /-atari-embeds\.googleusercontent\.com$/.test(window.location.hostname);

        // La selección es estado de interfaz: no debe exportarse ni restaurarse al abrir un diagrama
        const withoutSelection = (items) => items.map(({ selected, ...item }) => item);
        const foldersWithoutSelection = (folders) => folders.map(f => ({ ...f, diagrams: f.diagrams.map(d => ({ ...d, nodes: withoutSelection(d.nodes), edges: withoutSelection(d.edges) })) }));

        // Contenido de las carpetas sin datos de interfaz (carpetas abiertas/cerradas, selección), para detectar cambios
        const contentSnapshot = (folders) => JSON.stringify(foldersWithoutSelection(folders).map(({ isOpen, ...f }) => f));

        const toBase64Url = (bytes) => {
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        };
        const fromBase64Url = (str) => {
            const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
            const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
            return Uint8Array.from(bin, c => c.charCodeAt(0));
        };

        const encodeDiagramForLink = async (diagram) => {
            const payload = {
                v: 1, name: diagram.name, type: diagram.type,
                nodes: diagram.nodes.map(({ selected, ...n }) => n),
                edges: diagram.edges.map(({ selected, ...e }) => e),
            };
            const stream = new Blob([JSON.stringify(payload)]).stream().pipeThrough(new CompressionStream('deflate-raw'));
            return toBase64Url(new Uint8Array(await new Response(stream).arrayBuffer()));
        };

        // Acepta el enlace completo o solo el código; descarta nodos y relaciones mal formados
        const decodeSharedDiagram = async (input) => {
            const text = input.trim();
            const idx = text.indexOf(SHARE_HASH_PREFIX);
            const code = (idx >= 0 ? text.slice(idx + SHARE_HASH_PREFIX.length) : text).split(/[&\s]/)[0];
            const stream = new Blob([fromBase64Url(code)]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
            const data = JSON.parse(await new Response(stream).text());
            if (!data || !['dcu', 'dc', 'da'].includes(data.type) || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) throw new Error('Formato no válido');
            const nodes = data.nodes.filter(n => n && typeof n.id === 'string' && ['x', 'y', 'width', 'height'].every(k => Number.isFinite(n[k])));
            const ids = new Set(nodes.map(n => n.id));
            const edges = data.edges.filter(e => e && typeof e.id === 'string' && ids.has(e.source) && ids.has(e.target));
            const name = typeof data.name === 'string' && data.name.trim() ? data.name.trim() : 'Diagrama compartido';
            return { name, type: data.type, nodes, edges };
        };

        // Fuera de Google Sites (alojamiento directo o servidor local) el enlace apunta a la propia página y se abre solo
        const getShareBaseUrl = () => {
            const { protocol, hostname, origin, pathname } = window.location;
            const direct = (protocol === 'http:' || protocol === 'https:') && !hostname.endsWith('googleusercontent.com');
            return direct ? origin + pathname : APP_URL + '/';
        };

        // Copia primero con execCommand (funciona en iframes sin permiso de portapapeles) y, si no, con la API moderna
        const copyFromField = async (field) => {
            try { field.focus(); field.select(); if (document.execCommand('copy')) return true; } catch (e) { /* se intenta la API */ }
            try { await navigator.clipboard.writeText(field.value); return true; } catch (e) { return false; }
        };

        const DIAGRAM_TYPE_NAMES = { dcu: 'Casos de uso', dc: 'Clases', da: 'Actividad' };

        // Tecla modificadora principal según el sistema (para la ayuda y las descripciones de los botones)
        const MOD_KEY = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? '⌘' : 'Ctrl';

        const SHORTCUT_GROUPS = [
            { title: 'Edición', items: [
                [`${MOD_KEY}+Z`, 'Deshacer'],
                [`${MOD_KEY}+Mayús+Z  ·  ${MOD_KEY}+Y`, 'Rehacer'],
                [`${MOD_KEY}+C  ·  ${MOD_KEY}+X  ·  ${MOD_KEY}+V`, 'Copiar, cortar y pegar elementos (también entre diagramas del mismo tipo)'],
                [`${MOD_KEY}+D`, 'Duplicar la selección'],
                ['Supr  ·  Retroceso', 'Eliminar la selección'],
                ['Doble clic', 'Editar el texto de un elemento'],
            ]},
            { title: 'Selección', items: [
                ['Clic', 'Seleccionar un elemento o una relación'],
                ['Mayús+clic', 'Añadir o quitar un elemento de la selección'],
                ['Arrastrar en el fondo', 'Seleccionar con un recuadro (Mayús: añadir a la selección)'],
                [`${MOD_KEY}+A`, 'Seleccionar todos los elementos'],
                ['Esc', 'Cancelar la conexión o la herramienta; si no hay ninguna, deseleccionar'],
            ]},
            { title: 'Mover', items: [
                ['Flechas', 'Mover la selección 1 px'],
                ['Mayús+flechas', 'Mover la selección 10 px'],
            ]},
            { title: 'Vista', items: [
                ['Rueda', 'Desplazar el lienzo'],
                ['Mayús+rueda', 'Desplazar el lienzo en horizontal'],
                [`${MOD_KEY}+rueda`, 'Zoom hacia el cursor'],
                [`${MOD_KEY}+0`, 'Zoom al 100 %'],
                ['Botón central  ·  Alt+arrastrar', 'Mover el lienzo (en algunos escritorios Linux, Alt+arrastrar mueve la ventana: usa el botón central)'],
                ['?', 'Mostrar u ocultar esta ayuda'],
            ]},
        ];

        const ShortcutsModal = ({ isOpen, onClose, isDarkMode }) => {
            if (!isOpen) return null;
            const kbd = `inline-block px-1.5 py-0.5 rounded border text-xs font-mono whitespace-nowrap ${isDarkMode ? 'bg-gray-700 border-gray-600' : 'bg-gray-100 border-gray-300'}`;
            return (
                <div className="absolute inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-30 backdrop-blur-sm" onMouseDown={e => e.stopPropagation()} onClick={onClose}>
                    <div className={`p-6 rounded-lg shadow-xl border w-[40rem] max-w-[95%] max-h-[90%] overflow-y-auto ${isDarkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-200 text-gray-800'}`} onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold flex items-center gap-2"><Keyboard size={18} className="text-blue-500"/> Atajos de teclado y ratón</h3>
                            <button onClick={onClose} className={`p-1 rounded-full ${isDarkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`} title="Cerrar (Esc)"><X size={18}/></button>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4">
                            {SHORTCUT_GROUPS.map(group => (
                                <div key={group.title}>
                                    <h4 className="text-xs font-semibold uppercase tracking-wider opacity-60 mb-2">{group.title}</h4>
                                    <dl className="space-y-1.5 text-sm">
                                        {group.items.map(([keys, desc]) => (
                                            <div key={keys} className="flex flex-col">
                                                <dt className="flex flex-wrap gap-1">{keys.split('  ·  ').map(k => <kbd key={k} className={kbd}>{k}</kbd>)}</dt>
                                                <dd className="text-xs opacity-75 mt-0.5">{desc}</dd>
                                            </div>
                                        ))}
                                    </dl>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // Colores de los avisos (contraste de texto >= 4.5:1 en todos los casos)
        const TOAST_STYLES = {
          success: 'bg-green-700 text-white',
          warning: 'bg-amber-400 text-gray-900',
          error: 'bg-red-700 text-white',
          info: 'bg-gray-800 text-white',
        };

        // Pasos máximos que se conservan en el historial de deshacer
        const MAX_HISTORY = 100;

        // Garantiza al menos una carpeta (p. ej. tras importar un JSON sin carpetas)
        const ensureFolders = (list) => (Array.isArray(list) && list.length > 0) ? list : [{ id: 'root', name: 'Mi proyecto UML', isOpen: true, diagrams: [] }];

        const calculatePerimeterPoint = (targetNode: NodeData, referencePoint: Point): Point => {
            const targetCenter = { x: targetNode.x + targetNode.width / 2, y: targetNode.y + targetNode.height / 2 };
            const dx = referencePoint.x - targetCenter.x;
            const dy = referencePoint.y - targetCenter.y;
            const angle = Math.atan2(dy, dx);
            const padding = 2;

            if (targetNode.type === 'actor') {
                const isBelow = referencePoint.y > targetCenter.y + (targetNode.height / 4);
                const radiusX = (targetNode.width / 2) + padding;
                let radiusY = (targetNode.height / 2) + padding;
                if (isBelow) radiusY += 25;
                return { x: targetCenter.x + radiusX * Math.cos(angle), y: targetCenter.y + radiusY * Math.sin(angle) };
            }
            else if (['usecase', 'start', 'end'].includes(targetNode.type)) {
                const radiusX = (targetNode.width / 2) + padding;
                const radiusY = (targetNode.height / 2) + padding;
                return { x: targetCenter.x + radiusX * Math.cos(angle), y: targetCenter.y + radiusY * Math.sin(angle) };
            } else if (targetNode.type === 'decision') {
                const w = (targetNode.width / 2) + padding;
                const h = (targetNode.height / 2) + padding;
                const tan = Math.tan(angle);
                const x = (w * h) / Math.sqrt(h * h + w * w * tan * tan);
                const y = x * Math.abs(tan);
                return { x: targetCenter.x + Math.sign(Math.cos(angle)) * x, y: targetCenter.y + Math.sign(Math.sin(angle)) * y };
            } else {
                const w = (targetNode.width / 2) + padding;
                const h = (targetNode.height / 2) + padding;
                const absCos = Math.abs(Math.cos(angle));
                const absSin = Math.abs(Math.sin(angle));
                const xDist = w / absCos;
                const yDist = h / absSin;
                const dist = Math.min(xDist, yDist);
                return { x: targetCenter.x + dist * Math.cos(angle), y: targetCenter.y + dist * Math.sin(angle) };
            }
        };

        const getMultiplicityPos = (start: Point, end: Point, distance = 15, offset = 8): Point => {
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            const angle = Math.atan2(dy, dx);
            const xBase = start.x + distance * Math.cos(angle);
            const yBase = start.y + distance * Math.sin(angle);
            const xOffset = xBase + offset * Math.cos(angle - Math.PI / 2);
            const yOffset = yBase + offset * Math.sin(angle - Math.PI / 2);
            return { x: xOffset, y: yOffset };
        };

        const getValidConnectionTypes = (source: NodeData, target: NodeData, diagramType: DiagramType): EdgeType[] => {
            // Restricción reflexiva en DC: Solo permitir Clases
            if (source.id === target.id) {
                if (diagramType === 'dc') {
                    if (source.type === 'class') {
                        return ['association', 'directed_association', 'dependency', 'aggregation', 'composition'];
                    }
                    return []; // Interfaces u otros no pueden tener reflexiva en este editor simple
                }
                return [];
            }

            if (diagramType === 'dcu') {
                if (source.type === 'boundary' || target.type === 'boundary') return [];
                if (source.type === 'actor' && target.type === 'actor') return ['generalization'];
                if ((source.type === 'actor' && target.type === 'usecase') || (source.type === 'usecase' && target.type === 'actor')) return ['association'];
                if (source.type === 'usecase' && target.type === 'usecase') return ['include', 'extend', 'generalization'];
                return [];
            }
            if (diagramType === 'dc') {
                if (source.type === 'interface' && target.type === 'interface') return ['generalization', 'dependency'];
                if (source.type === 'class' && target.type === 'interface') return ['implementation', 'dependency', 'directed_association', 'association'];
                if (source.type === 'interface' && target.type === 'class') return [];
                return ['association', 'directed_association', 'generalization', 'composition', 'aggregation', 'dependency'];
            }
            if (diagramType === 'da') return ['control'];
            return ['association'];
        };

        const ASSOCIATION_TYPES = ['association', 'directed_association', 'aggregation', 'composition'];

        // Relaciones ya existentes entre dos nodos (en cualquier sentido)
        const getEdgesBetween = (edges, aId, bId) => edges.filter(ed => (ed.source === aId && ed.target === bId) || (ed.source === bId && ed.target === aId));

        // Una sola relación por par de nodos, salvo en DC: allí se admiten varias asociaciones
        // (p. ej. Vuelo-Aeropuerto como origen y destino) y el resto de tipos una vez cada uno
        const filterTypesByExisting = (validTypes, existing, diagramType) => {
            if (diagramType !== 'dc') return existing.length > 0 ? [] : validTypes;
            return validTypes.filter(t => ASSOCIATION_TYPES.includes(t) || !existing.some(ed => ed.type === t));
        };

        const getEdgeLabel = (type) => {
            if (type === 'association') return 'Asociación simple';
            if (type === 'directed_association') return 'Asociación dirigida';
            if (type === 'generalization') return 'Generalización';
            if (type === 'implementation') return 'Implementación';
            if (type === 'include') return 'Inclusión';
            if (type === 'extend') return 'Extensión';
            if (type === 'composition') return 'Composición';
            if (type === 'aggregation') return 'Agregación';
            if (type === 'dependency') return 'Dependencia';
            if (type === 'control') return 'Flujo de control';
            return type.charAt(0).toUpperCase() + type.slice(1);
        }

        // --- COMPONENTES MODALES ---

        const DiagramOptionButton = ({ type, title, desc, onClick, isDarkMode }) => (
            <button
                type="button"
                onClick={(e) => { e.stopPropagation(); onClick(); }}
                className={`flex flex-col items-center p-6 rounded-lg border-2 transition-all hover:scale-105 ${isDarkMode ? 'border-gray-600 hover:border-blue-500 bg-gray-800' : 'border-gray-200 hover:border-blue-500 bg-white hover:shadow-lg'}`}
            >
                <div className={`mb-4 p-4 rounded-full ${isDarkMode ? 'bg-gray-700 text-blue-400' : 'bg-blue-50 text-blue-600'}`}>
                    <DiagramIcon type={type} size={48} />
                </div>
                <h4 className="font-bold text-lg mb-1">{title}</h4>
                <p className="text-xs opacity-60 text-center">{desc}</p>
            </button>
        );

        const RenameModal = ({ isOpen, initialText, title, onSave, onClose, isDarkMode }) => {
            const [text, setText] = useState(initialText);
            const inputRef = useRef(null);

            useEffect(() => {
                if (isOpen) {
                    setText(initialText);
                    setTimeout(() => {
                        if (inputRef.current) {
                            inputRef.current.focus();
                            inputRef.current.select();
                        }
                    }, 50);
                }
            }, [isOpen, initialText]);

            if (!isOpen) return null;

            return (
                <div className="absolute inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-30 backdrop-blur-sm" onMouseDown={e => e.stopPropagation()}>
                    <div className={`p-6 rounded-lg shadow-xl border w-96 ${isDarkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-200 text-gray-800'}`}>
                        <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
                            <Edit2 size={18} className="text-blue-500"/>
                            {title}
                        </h3>
                        <input
                            ref={inputRef}
                            type="text"
                            className={`w-full p-2 rounded border mb-4 focus:ring-2 focus:ring-blue-500 outline-none ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300 text-black'}`}
                            value={text}
                            onChange={e => setText(e.target.value)}
                            onKeyDown={e => {
                                if (e.key === 'Enter') onSave(text);
                                if (e.key === 'Escape') onClose();
                            }}
                        />
                        <div className="flex justify-end space-x-2">
                            <button
                                onClick={onClose}
                                className={`px-4 py-2 rounded font-medium ${isDarkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`}
                            >
                                Cancelar
                            </button>
                            <button
                                onClick={() => onSave(text)}
                                className="px-4 py-2 bg-blue-600 text-white rounded font-medium hover:bg-blue-700 shadow-sm"
                            >
                                Guardar
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const NewDiagramModal = ({ isOpen, onClose, onCreate, isDarkMode }) => {
            if (!isOpen) return null;
            return (
                <div className="absolute inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-40 backdrop-blur-sm" onMouseDown={(e) => e.stopPropagation()}>
                    <div className={`p-8 rounded-xl shadow-2xl max-w-4xl w-full mx-4 ${isDarkMode ? 'bg-gray-900 text-white' : 'bg-white text-gray-900'}`}>
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold">Crear nuevo diagrama</h2>
                            <button onClick={onClose} className="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700"><X size={20}/></button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <DiagramOptionButton type="dcu" title="Casos de Uso" desc="Actores, sistemas y relaciones para modelar requisitos funcionales." onClick={() => onCreate('dcu')} isDarkMode={isDarkMode} />
                            <DiagramOptionButton type="dc" title="Clases" desc="Estructura estática, atributos, métodos y relaciones entre objetos." onClick={() => onCreate('dc')} isDarkMode={isDarkMode} />
                            <DiagramOptionButton type="da" title="Actividades" desc="Flujos de control, decisiones y procesos de negocio concurrentes." onClick={() => onCreate('da')} isDarkMode={isDarkMode} />
                        </div>
                    </div>
                </div>
            );
        };

        const ConnectionModal = ({ pendingConnection, onConfirm, onCancel, isDarkMode }) => {
            // Los hooks van antes de cualquier return para respetar las reglas de React
            const validTypes = pendingConnection?.validTypes || [];
            const [selectedType, setSelectedType] = useState(validTypes[0]);

            useEffect(() => {
                setSelectedType(pendingConnection?.validTypes[0]);
            }, [pendingConnection]);

            if (!pendingConnection) return null;
            // Hasta que el efecto actualiza el estado, se usa el primer tipo válido
            const currentType = validTypes.includes(selectedType) ? selectedType : validTypes[0];

            return (
                <div className="absolute inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-20 backdrop-blur-sm" onMouseDown={(e) => e.stopPropagation()}>
                    <div className={`p-6 rounded-lg shadow-xl border w-80 ${isDarkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-200 text-gray-800'}`}>
                        <h3 className="text-lg font-bold mb-4">Nueva Conexión</h3>
                        <div className="space-y-2 mb-6">
                            {validTypes.map(t => (
                                <label key={t} className="flex items-center space-x-3 cursor-pointer p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded">
                                    <input type="radio" name="connType" checked={currentType === t} onChange={() => setSelectedType(t)} className="text-blue-600 focus:ring-blue-500" />
                                    <span>{getEdgeLabel(t)}</span>
                                </label>
                            ))}
                        </div>
                        <div className="flex flex-col space-y-2">
                            <div className="flex space-x-2">
                                <button onClick={onCancel} className="flex-1 py-2 border border-gray-300 rounded hover:bg-gray-100 dark:hover:bg-gray-700">Cancelar</button>
                                <button onClick={() => onConfirm(currentType)} className="flex-1 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Crear</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

                            <p>
                                En esta asignatura utilizamos herramientas UML profesionales muy potentes, pero también complejas. Por ello, un editor sencillo como este resulta más didáctico para introducir los conceptos básicos del diseño sin barreras de entrada.
                            </p>
                        </div>

                        <div className="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700 flex justify-between items-center text-xs opacity-60">
                            <span>© {new Date().getFullYear()} Pablo Felip</span>
                            <div className="flex gap-4">
                                <a href="https://github.com/pfelipm/arquitecto-uml" target="_blank" rel="noreferrer" className="hover:text-blue-500 flex items-center gap-1"><Github size={14}/> GitHub</a>
                                <a href="https://www.linkedin.com/in/pfelipm" target="_blank" rel="noreferrer" className="hover:text-blue-500 flex items-center gap-1"><Linkedin size={14}/> LinkedIn</a>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ShareLinkModal = ({ isOpen, link, diagramName, onCopy, onClose, isDarkMode }) => {
            const fieldRef = useRef(null);
            if (!isOpen) return null;
            const fieldClass = `w-full p-2 rounded border font-mono text-xs break-all resize-none focus:ring-2 focus:ring-blue-500 outline-none ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50 border-gray-300 text-black'}`;
            return (
                <div className="absolute inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-30 backdrop-blur-sm" onMouseDown={e => e.stopPropagation()}>
                    <div className={`p-6 rounded-lg shadow-xl border w-[28rem] max-w-[95%] ${isDarkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-200 text-gray-800'}`}>
                        <h3 className="text-lg font-bold mb-3 flex items-center gap-2"><Link2 size={18} className="text-blue-500"/> Compartir «{diagramName}»</h3>
                        {link === null ? (
                            <p className="text-sm opacity-70 mb-4">Generando enlace…</p>
                        ) : (<>
                            <textarea ref={fieldRef} readOnly rows={4} value={link} onFocus={e => e.target.select()} className={fieldClass} />
                            <p className="text-xs opacity-70 mt-2">Quien reciba el enlace podrá añadir una copia de este diagrama a los suyos; los cambios que hagas después no se reflejan en el enlace.</p>
                            <p className="text-xs opacity-70 mt-2">Si al abrirlo no aparece el diagrama (por ejemplo, desde la web pública), basta con pegar el enlace en <strong>Abrir diagrama compartido</strong> <Link2 size={11} className="inline"/>, en la barra superior.</p>
                            {link.length > SHARE_LONG_LINK && (
                                <p className={`text-xs mt-2 p-2 rounded flex gap-2 ${isDarkMode ? 'bg-amber-900/40 text-amber-200' : 'bg-amber-50 text-amber-800'}`}><AlertTriangle size={14} className="flex-shrink-0 mt-0.5"/> El enlace es muy largo ({link.length.toLocaleString('es-ES')} caracteres) y algunos servicios podrían recortarlo. Para diagramas grandes es más fiable exportar una copia JSON.</p>
                            )}
                        </>)}
                        <div className="flex justify-end space-x-2 mt-4">
                            <button onClick={onClose} className={`px-4 py-2 rounded font-medium ${isDarkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`}>Cerrar</button>
                            <button disabled={link === null} onClick={() => onCopy(fieldRef.current)} className="px-4 py-2 bg-blue-600 text-white rounded font-medium hover:bg-blue-700 shadow-sm disabled:opacity-50 flex items-center gap-2"><Copy size={14}/> Copiar enlace</button>
                        </div>
                    </div>
                </div>
            );
        };

        const OpenSharedModal = ({ isOpen, initialText, onOpen, onClose, isDarkMode }) => {
            const [text, setText] = useState(initialText || '');
            const fieldRef = useRef(null);
            useEffect(() => {
                if (isOpen) { setText(initialText || ''); setTimeout(() => fieldRef.current?.focus(), 50); }
            }, [isOpen, initialText]);
            if (!isOpen) return null;
            return (
                <div className="absolute inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-30 backdrop-blur-sm" onMouseDown={e => e.stopPropagation()}>
                    <div className={`p-6 rounded-lg shadow-xl border w-[28rem] max-w-[95%] ${isDarkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-200 text-gray-800'}`}>
                        <h3 className="text-lg font-bold mb-3 flex items-center gap-2"><Link2 size={18} className="text-blue-500"/> Abrir diagrama compartido</h3>
                        <p className="text-xs opacity-70 mb-2">Pega el enlace que te han compartido. Se añadirá una copia a la carpeta «{SHARED_FOLDER_NAME}».</p>
                        <textarea ref={fieldRef} rows={4} value={text} onChange={e => setText(e.target.value)} placeholder="https://…#d=…" className={`w-full p-2 rounded border font-mono text-xs break-all resize-none focus:ring-2 focus:ring-blue-500 outline-none ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300 text-black'}`} />
                        <div className="flex justify-end space-x-2 mt-4">
                            <button onClick={onClose} className={`px-4 py-2 rounded font-medium ${isDarkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`}>Cancelar</button>
                            <button disabled={!text.trim()} onClick={() => onOpen(text)} className="px-4 py-2 bg-blue-600 text-white rounded font-medium hover:bg-blue-700 shadow-sm disabled:opacity-50">Abrir</button>
                        </div>
                    </div>
                </div>
            );
        };

        const ImportModeModal = ({ pendingImport, currentCount, onAppend, onReplace, onCancel, isDarkMode }) => {
            if (!pendingImport) return null;
            const folderCount = pendingImport.folders.length;
            const diagramCount = pendingImport.folders.reduce((n, f) => n + f.diagrams.length, 0);
            return (
                <div className="absolute inset-0 z-[100] flex items-center justify-center bg-black bg-opacity-30 backdrop-blur-sm" onMouseDown={e => e.stopPropagation()}>
                    <div className={`p-6 rounded-lg shadow-xl border w-[28rem] max-w-[95%] ${isDarkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-200 text-gray-800'}`}>
                        <h3 className="text-lg font-bold mb-3 flex items-center gap-2"><Upload size={18} className="text-blue-500"/> Importar copia de seguridad</h3>
                        <p className="text-sm mb-1">El archivo contiene <strong>{diagramCount} {diagramCount === 1 ? 'diagrama' : 'diagramas'}</strong> en {folderCount} {folderCount === 1 ? 'carpeta' : 'carpetas'}.</p>
                        <p className="text-sm opacity-70 mb-4">Ahora tienes {currentCount} {currentCount === 1 ? 'diagrama' : 'diagramas'}. ¿Qué quieres hacer?</p>
                        <div className="space-y-2">
                            <button onClick={onAppend} className="w-full text-left p-3 rounded border-2 border-blue-500 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 dark:hover:bg-blue-900/50">
                                <span className="font-semibold block">Añadir a mis diagramas</span>
                                <span className="text-xs opacity-70">Las carpetas importadas se suman a las tuyas. No se pierde nada.</span>
                            </button>
                            <button onClick={onReplace} className={`w-full text-left p-3 rounded border ${isDarkMode ? 'border-gray-600 hover:bg-red-900/30' : 'border-gray-300 hover:bg-red-50'}`}>
                                <span className={`font-semibold block ${isDarkMode ? 'text-red-300' : 'text-red-700'}`}>Reemplazar todo</span>
                                <span className="text-xs opacity-70">Se borran tus {currentCount} {currentCount === 1 ? 'diagrama' : 'diagramas'} actuales y se sustituyen por los del archivo. No se puede deshacer.</span>
                            </button>
                        </div>
                        <div className="flex justify-end mt-4">
                            <button onClick={onCancel} className={`px-4 py-2 rounded font-medium ${isDarkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}`}>Cancelar</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE PRINCIPAL ---

        function ArquitectoUML() {
          // --- ESTADO ---
          const [isDarkMode, setIsDarkMode] = useState(false);
          const [folders, setFolders] = useState([{ id: 'root', name: 'Mi proyecto UML', isOpen: true, diagrams: [] }]);
          const [activeDiagramId, setActiveDiagramId] = useState(null);

          const [showInfoModal, setShowInfoModal] = useState(false);
          const [showShortcuts, setShowShortcuts] = useState(false);

          // Compartir: shareLink es undefined (modal cerrado), null (generando) o el enlace
          const [shareLink, setShareLink] = useState(undefined);
          // Abrir compartido: null (cerrado) o el texto inicial del modal
          const [openSharedText, setOpenSharedText] = useState(null);
          // Copia JSON leída y pendiente de decidir si se añade o reemplaza
          const [pendingImport, setPendingImport] = useState(null);
          // Solo con almacenamiento efímero (Sites): contenido en el momento de la última exportación o restauración
          const [savedSnapshot, setSavedSnapshot] = useState(null);
          const [storageNoticeCollapsed, setStorageNoticeCollapsed] = useState(false);

          const [creatingDiagramInFolderId, setCreatingDiagramInFolderId] = useState(null);

          // Renombrado (Diagramas y Carpetas)
          const [renamingId, setRenamingId] = useState(null);

          // Eliminación (Diagramas y Carpetas)
          const [deleteConfirm, setDeleteConfirm] = useState(null);

          const [toastMessage, setToastMessage] = useState(null);
          // Durante la exportación a PNG se renderiza sin resaltado de selección ni tiradores
          const [isExporting, setIsExporting] = useState(false);

          const [nodes, setNodes] = useState([]);
          const [edges, setEdges] = useState([]);
          const [scale, setScale] = useState(1);
          const [pan, setPan] = useState({ x: 0, y: 0 });

          const [tool, setTool] = useState('select');
          const [connectingNodeId, setConnectingNodeId] = useState(null);
          const [pendingConnection, setPendingConnection] = useState(null);

          const [editingLabelId, setEditingLabelId] = useState(null);
          const [editingLabelText, setEditingLabelText] = useState("");

          const [selectionBox, setSelectionBox] = useState(null);
          const [isDragging, setIsDragging] = useState(false);
          const [isResizing, setIsResizing] = useState(false);
          const [resizeHandle, setResizeHandle] = useState(null);
          const [activeNodeId, setActiveNodeId] = useState(null);

          const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
          const [initialNodeGeom, setInitialNodeGeom] = useState(null);
          const [smartGuides, setSmartGuides] = useState([]);
          const [showProperties, setShowProperties] = useState(true);

          const [draggedDiagramId, setDraggedDiagramId] = useState(null);
          const [dragOverId, setDragOverId] = useState(null);
          const [history, setHistory] = useState({ past: [], future: [] });

          const canvasRef = useRef(null);
          const svgRef = useRef(null);
          const fileInputRef = useRef(null);

          const lastClickRef = useRef({id: '', time: 0});
          // Estado previo a un arrastre/redimensionado, para poder deshacerlo
          const dragSnapshotRef = useRef(null);
          // Indica si la edición de texto en curso ya ha guardado su punto de deshacer
          const textEditPushedRef = useRef(false);

          // --- EFECTOS ---
          useEffect(() => {
            const saved = localStorage.getItem('arquitecto_data');
            if (saved) { try {
                const parsed = JSON.parse(saved);
                const loadedFolders = ensureFolders(parsed.folders);
                setFolders(loadedFolders); setIsDarkMode(parsed.darkMode || false);
                // Reabrir el último diagrama abierto, si sigue existiendo
                if (loadedFolders.some(f => f.diagrams.some(d => d.id === parsed.activeDiagramId))) setActiveDiagramId(parsed.activeDiagramId);
            } catch (e) { console.error(e); } }

            // Enlace compartido abierto directamente: se ofrece importarlo y se limpia la URL para no repetirlo al recargar
            if (window.location.hash.startsWith(SHARE_HASH_PREFIX)) {
                setOpenSharedText(window.location.href);
                // window.history: dentro del componente, "history" es el estado de deshacer
                try { window.history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) { /* p. ej. iframe aislado */ }
            }
          }, []);
          // activeDiagramId solo se guarda en el navegador; no forma parte de las copias JSON exportadas
          useEffect(() => { localStorage.setItem('arquitecto_data', JSON.stringify({ folders, darkMode: isDarkMode, activeDiagramId })); }, [folders, isDarkMode, activeDiagramId]);
          useEffect(() => { if (isDarkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }, [isDarkMode]);

          const activeDiagram = useMemo(() => folders.flatMap(f => f.diagrams).find(d => d.id === activeDiagramId) || null, [folders, activeDiagramId]);

          useEffect(() => {
            if (activeDiagram) {
              setNodes(withoutSelection(activeDiagram.nodes));
              setEdges(withoutSelection(activeDiagram.edges));
              setHistory({ past: [], future: [] });
              setConnectingNodeId(null);
              setPendingConnection(null);
            }
          }, [activeDiagramId]);

          // kind: 'success' | 'warning' | 'error' | 'info'. El temporizador se reinicia para que un aviso nuevo no se cierre antes de tiempo
          const toastTimerRef = useRef(null);
          const showToast = (msg, kind = 'info') => {
            setToastMessage({ text: msg, kind });
            clearTimeout(toastTimerRef.current);
            toastTimerRef.current = setTimeout(() => setToastMessage(null), kind === 'error' ? 5000 : 3000);
          };

          // --- PERSISTENCIA JSON (Importar/Exportar) ---
          const handleExportJSON = () => {
            const dataStr = JSON.stringify({ version: "7.6", folders: foldersWithoutSelection(folders), darkMode: isDarkMode }, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            // Fecha local (toISOString usa UTC y de madrugada daría el día anterior)
            const today = new Date();
            const localDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            link.download = `arquitecto_uml_${localDate}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Copia de seguridad descargada correctamente", 'success');
            setSavedSnapshot(contentSnapshot(folders));
          };

          // Hay diagramas cuyo contenido aún no está en ninguna copia exportada (solo importa si el almacenamiento es efímero)
          const currentSnapshot = useMemo(() => IS_EPHEMERAL_STORAGE ? contentSnapshot(folders) : null, [folders]);
          const hasUnexportedChanges = IS_EPHEMERAL_STORAGE && folders.some(f => f.diagrams.length > 0) && currentSnapshot !== savedSnapshot;

          const handleImportClick = () => fileInputRef.current?.click();

          // --- COMPARTIR DIAGRAMA (enlace con el diagrama comprimido) ---
          const handleShare = async () => {
            if (!activeDiagram) return;
            if (nodes.length === 0) { showToast("El diagrama está vacío", 'warning'); return; }
            setShareLink(null);
            try {
                // Se usa el estado del lienzo, que es el más reciente
                const code = await encodeDiagramForLink({ ...activeDiagram, nodes, edges });
                setShareLink(getShareBaseUrl() + SHARE_HASH_PREFIX + code);
            } catch (err) {
                console.error(err);
                setShareLink(undefined);
                showToast("No se pudo generar el enlace en este navegador", 'error');
            }
          };

          const handleCopyShareLink = async (field) => {
            if (!field) return;
            if (await copyFromField(field)) showToast("Enlace copiado al portapapeles", 'success');
            else showToast("No se pudo copiar automáticamente: selecciona el enlace y cópialo a mano", 'warning');
          };

          const handleOpenShared = async (text) => {
            let shared;
            try { shared = await decodeSharedDiagram(text); }
            catch (err) { showToast("El enlace no es válido o está incompleto", 'error'); return; }
            const newDiag = { id: generateId(), name: shared.name, type: shared.type, nodes: shared.nodes, edges: shared.edges, createdAt: Date.now() };
            // Los diagramas recibidos se agrupan en su propia carpeta, que se crea si no existe
            setFolders(prev => prev.some(f => f.name === SHARED_FOLDER_NAME)
                ? prev.map(f => f.name === SHARED_FOLDER_NAME ? { ...f, isOpen: true, diagrams: [...f.diagrams, newDiag] } : f)
                : [...prev, { id: generateId(), name: SHARED_FOLDER_NAME, isOpen: true, diagrams: [newDiag] }]);
            setActiveDiagramId(newDiag.id);
            setOpenSharedText(null);
            showToast(`«${shared.name}» añadido a «${SHARED_FOLDER_NAME}»`, 'success');
          };

          // mode: 'replace' sustituye todas las carpetas; 'append' añade las importadas con ids nuevos
          const applyImport = (imported, mode) => {
            let importedFolders, newFolders;
            if (mode === 'append') {
                const usedNames = new Set(folders.map(f => f.name));
                importedFolders = imported.folders.map(f => {
                    let name = f.name || 'Carpeta importada';
                    if (usedNames.has(name)) name = `${name} (importada)`;
                    usedNames.add(name);
                    // Ids nuevos para que no choquen con diagramas que ya existen (p. ej. al importar dos veces la misma copia)
                    return { ...f, id: generateId(), name, diagrams: f.diagrams.map(d => ({ ...d, id: generateId() })) };
                });
            } else {
                importedFolders = ensureFolders(imported.folders);
                if (imported.darkMode !== undefined) setIsDarkMode(imported.darkMode);
            }
            // Se abre el primer diagrama importado (y su carpeta); si no hay ninguno, se muestra la bienvenida
            const firstFolder = importedFolders.find(f => f.diagrams.length > 0);
            const firstDiagram = firstFolder?.diagrams[0] || null;
            importedFolders = importedFolders.map(f => f === firstFolder ? { ...f, isOpen: true } : f);
            newFolders = mode === 'append' ? [...folders, ...importedFolders] : importedFolders;
            setFolders(newFolders);
            // Tras reemplazar, todo el contenido está ya en el archivo importado
            if (mode === 'replace') setSavedSnapshot(contentSnapshot(newFolders));
            setCreatingDiagramInFolderId(null);
            setPendingImport(null);
            if (mode === 'append' && !firstDiagram) { showToast("La copia no contenía diagramas", 'warning'); return; }
            showToast(mode === 'append' ? "Diagramas importados y añadidos a los tuyos" : "Copia de seguridad restaurada", 'success');
            setActiveDiagramId(firstDiagram?.id || null);
            // Carga directa: si el id coincide con el diagrama ya abierto, el efecto de cambio de diagrama no se dispararía
            setNodes(withoutSelection(firstDiagram?.nodes || [])); setEdges(withoutSelection(firstDiagram?.edges || []));
            setHistory({ past: [], future: [] }); setConnectingNodeId(null); setPendingConnection(null);
          };

          const handleImportFile = (event) => {
            const file = event.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const content = e.target?.result;
                    const parsed = JSON.parse(content);
                    if (parsed.folders && Array.isArray(parsed.folders)) {
                        const imported = { ...parsed, folders: parsed.folders.map(f => ({ ...f, diagrams: Array.isArray(f.diagrams) ? f.diagrams : [] })) };
                        // Si ya hay diagramas, se pregunta si añadir o reemplazar; si no, no hay nada que perder
                        if (folders.some(f => f.diagrams.length > 0)) setPendingImport(imported);
                        else applyImport(imported, 'replace');
                    } else {
                        showToast("Error: Formato de archivo inválido", 'error');
                    }
                } catch (err) {
                    showToast("Error al leer el archivo", 'error');
                    console.error(err);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
          };

          // --- EXPORTAR PNG ---
          const handleExportPNG = () => {
              if (!svgRef.current || nodes.length === 0) {
                  showToast("El diagrama está vacío", 'warning');
                  return;
              }
              // Se vuelve a renderizar sin selección; el efecto de abajo clona el SVG ya actualizado
              setIsExporting(true);
          };

          useEffect(() => {
              if (!isExporting) return;
              exportPNGNow();
              setIsExporting(false);
          }, [isExporting]);

          const exportPNGNow = () => {
              if (!svgRef.current) return;

              // 1. Calcular Bounding Box de todo el contenido dibujado (nodos, relaciones, bucles reflexivos y etiquetas)
              const mainGroupEl = svgRef.current.querySelector(':scope > g');
              if (!mainGroupEl) return;
              const bbox = mainGroupEl.getBBox();
              let minX = bbox.x, minY = bbox.y, maxX = bbox.x + bbox.width, maxY = bbox.y + bbox.height;

              // Añadir margen
              const padding = 50;
              minX -= padding; minY -= padding;
              maxX += padding; maxY += padding;

              const width = maxX - minX;
              const height = maxY - minY;

              // 2. Clonar el SVG para manipularlo sin afectar la vista actual
              const svgClone = svgRef.current.cloneNode(true);

              // --- FIX: Inyectar estilos de fuente explícitos para la exportación ---
              // Al estar fuera del contexto del navegador, el SVG necesita saber qué fuente usar.
              // Usamos la pila de fuentes estándar de Tailwind/Sistemas modernos.
              svgClone.style.fontFamily = 'ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif';

              // Ajustar viewBox del clon para enfocar solo el contenido
              svgClone.setAttribute('viewBox', `${minX} ${minY} ${width} ${height}`);
              svgClone.setAttribute('width', width.toString());
              svgClone.setAttribute('height', height.toString());

              // Eliminar transformaciones del grupo principal del clon (el pan/zoom del usuario)
              const mainGroup = svgClone.querySelector('g');
              if (mainGroup) {
                  mainGroup.setAttribute('transform', ''); // Reset transform
              }

              // Añadir fondo (rect) porque el SVG es transparente por defecto
              const bgRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
              bgRect.setAttribute('x', minX.toString());
              bgRect.setAttribute('y', minY.toString());
              bgRect.setAttribute('width', width.toString());
              bgRect.setAttribute('height', height.toString());
              bgRect.setAttribute('fill', isDarkMode ? '#1f2937' : '#ffffff');
              if (svgClone.firstChild) {
                  svgClone.insertBefore(bgRect, svgClone.firstChild);
              } else {
                  svgClone.appendChild(bgRect);
              }

              // 3. Serializar y Renderizar a Canvas
              const serializer = new XMLSerializer();
              const svgString = serializer.serializeToString(svgClone);
              const img = new Image();
              const svgBlob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
              const url = URL.createObjectURL(svgBlob);

              img.onload = () => {
                  const canvas = document.createElement('canvas');
                  // Resolución mínima 2x para que el PNG se vea nítido en pantallas HiDPI
                  const pixelRatio = Math.max(2, window.devicePixelRatio || 1);
                  canvas.width = Math.ceil(width * pixelRatio);
                  canvas.height = Math.ceil(height * pixelRatio);
                  const ctx = canvas.getContext('2d');
                  if (ctx) {
                      ctx.scale(pixelRatio, pixelRatio);
                      ctx.drawImage(img, 0, 0, width, height);
                      const pngUrl = canvas.toDataURL('image/png');

                      // Descargar
                      const link = document.createElement('a');
                      link.href = pngUrl;
                      link.download = `${activeDiagram?.name || 'diagrama'}.png`;
                      document.body.appendChild(link);
                      link.click();
                      document.body.removeChild(link);
                      URL.revokeObjectURL(url);
                      showToast("Imagen exportada correctamente", 'success');
                  }
              };
              img.src = url;
          };

          // --- FUNCIONES CRÍTICAS ---

          const saveCurrentDiagram = (newNodes, newEdges) => {
            if (!activeDiagramId) return;
            setFolders(prev => prev.map(f => ({ ...f, diagrams: f.diagrams.map(d => d.id === activeDiagramId ? { ...d, nodes: newNodes, edges: newEdges } : d) })));
          };
